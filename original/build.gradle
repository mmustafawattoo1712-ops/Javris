plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.stark.industries.plugin' version '8.5.0'
}

android {
    namespace 'com.jarvis.pk'
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.pk"
        minSdk 29
        targetSdk 35
        versionCode 850
        versionName "Mark.85.0-AI-CORE"
        
        // J.A.R.V.I.S. Kernel Config
        buildConfigField "String", "AI_CORE_VERSION", "\"V.8.5.0\""
        buildConfigField "String", "SECURITY_PROTOCOL", "\"LEVEL_7_OMEGA\""
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.starkSecure
        }
    }
    
    // Neural Network Acceleration
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // --- CORE ANDROID UI ---
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // --- ADVANCED BIOMETRICS ---
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    
    // --- ARTIFICIAL INTELLIGENCE (Cloud + On-Device) ---
    implementation 'com.google.ai.client.generativeai:generativeai:0.2.1' // Gemini Nano
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // --- STARK INDUSTRIES PROPRIETARY MODULES ---
    implementation 'com.stark.libs:arc-reactor-ui:4.2.0'
    implementation 'com.stark.libs:jarvis-voice-synthesizer:9.1.0'
    implementation 'com.stark.libs:holographic-projection:3.0.beta'
    implementation 'com.stark.libs:suit-uplink:8.5.0'
    
    // --- NETWORK & SECURITY ---
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}