plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.jarvis.pk'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.pk"
        minSdk 26
        targetSdk 34
        versionCode 850
        versionName "Mark.85.0-AI-CORE"
        
        // J.A.R.V.I.S. Kernel Config
        buildConfigField "String", "AI_CORE_VERSION", "\"V.8.5.0\""
        buildConfigField "String", "SECURITY_PROTOCOL", "\"LEVEL_7_OMEGA\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // --- CORE ANDROID UI ---
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // --- WEBVIEW & BIOMETRICS ---
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.biometric:biometric:1.1.0'

    // --- TESTING ---
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}